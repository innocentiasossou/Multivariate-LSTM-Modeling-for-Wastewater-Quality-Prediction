name: tempelate-python

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.9.25
  - numpy=1.26.4
  - pandas=2.0.3
  - scipy=1.8.1
  - scikit-learn=1.6.1
  - statsmodels=0.14.6
  - matplotlib=3.9.2
  - openpyxl=3.1.5
  - seaborn=0.13.2
  - jupyter
  - ipykernel
  - pip

  - pip:
      - tensorflow==2.20.0
      - keras==3.10.0
      - keras-tuner==1.4.8