abstract: >+
  The proposed approach relies on high-frequency multivariate time series collected at the Seine aval (SIAAP \footnote{Syndicat Interdépartemental pour l’Assainissement de l’Agglomération Parisienne}) treatment plant, including pH, temperature, conductivity, and total suspended solids, as well as exogenous variables related to precipitation and measurements from an upstream plant. The objective is to forecast wastewater quality over a 24-hour horizon. A multivariate Long Short-Term Memory (LSTM) recurrent neural network is implemented to capture complex temporal dependencies and nonlinear patterns in the data. The model is trained on one year of data and validated on four months of data (one per season), and is compared with a persistence model and SARIMA models. The evaluation shows an overall superiority of the LSTM model, particularly for variables exhibiting high levels of noise and nonlinearity.
keywords: [Recurrent neural networks, multivariate LSTM, SARIMA, real-time forecasting, wastewater quality, multivariate time series modeling]
